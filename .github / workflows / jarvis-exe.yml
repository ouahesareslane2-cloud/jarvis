name: Construire jarvis.exe
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les modules
        run: pip install -r requirements.txt
      - name: Fabriquer jarvis.exe
        run: pyinstaller --onefile --noconsole --name jarvis --collect-all pptx --collect-all speech_recognition --collect-all sounddevice --collect-all edge_tts jarvis.py
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-exe
          path: dist/jarvis.exe
